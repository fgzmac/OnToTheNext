services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ontothenext
      POSTGRES_USER: ontothenext
      POSTGRES_PASSWORD: ontothenext
    ports:
      - "5433:5432"
    volumes:
      - ontothenext-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontothenext -d ontothenext"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ontothenext-postgres:
