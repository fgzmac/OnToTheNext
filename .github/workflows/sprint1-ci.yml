name: Sprint 1 CI

on:
  push:
    branches:
      - sprint-1-foundation
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ontothenext_test
          POSTGRES_USER: ontothenext
          POSTGRES_PASSWORD: ontothenext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontothenext -d ontothenext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ontothenext:ontothenext@localhost:5432/ontothenext_test?schema=public
      TEST_DATABASE_URL: postgresql://ontothenext:ontothenext@localhost:5432/ontothenext_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:deploy
      - name: Seed deterministic fixture
        run: npm run db:seed
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
