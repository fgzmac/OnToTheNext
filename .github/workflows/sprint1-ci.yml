name: Application CI

on:
  push:
    branches:
      - sprint-1-foundation
      - sprint-2-discover-core
      - sprint-3-itinerary-builder
      - sprint-4-reservation-workflow
      - sprint-5-today-mode
      - refine/itinerary-builder-basics
      - feat/cross-destination-discovery
  pull_request:
    branches:
      - main
      - refine/itinerary-builder-basics
      - sprint-5-today-mode

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ontothenext_test
          POSTGRES_USER: ontothenext
          POSTGRES_PASSWORD: ontothenext
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ontothenext -d ontothenext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ontothenext:ontothenext@localhost:5433/ontothenext_test?schema=public
      PLAYWRIGHT_BROWSERS_PATH: "0"
      TEST_DATABASE_URL: postgresql://ontothenext:ontothenext@localhost:5433/ontothenext_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Verify disposable CI database identity before mutations
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_POSTGRES_SERVICE: ${{ toJSON(job.services.postgres) }}
        run: node --import tsx scripts/ci-database-preflight.mjs
      - name: Apply migrations
        run: npm run db:deploy
      - name: Seed deterministic fixture
        run: npm run db:seed
      - name: Verify reset and deterministic reseed
        run: npm run db:reset
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run e2e
